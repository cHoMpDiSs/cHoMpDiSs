<svg width="880" height="312" viewBox="0 0 880 312" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jordon Marchesano — AI Engineer at Get Covered">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#0d1726"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1">
      <stop offset="0" stop-color="#38e1ff"/>
      <stop offset="0.5" stop-color="#9dffb0"/>
      <stop offset="1" stop-color="#38e1ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0; 0.6 0; -0.6 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38e1ff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#38e1ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.018"/>
    </pattern>
    <clipPath id="card"><rect width="880" height="312" rx="14"/></clipPath>
    <clipPath id="type"><rect x="32" y="64" height="30" width="0">
      <animate attributeName="width" values="0;11;22;32;43;54;64;75;86" keyTimes="0.0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1.0" calcMode="discrete" dur="0.9s" begin="0.4s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="312" fill="url(#bg)"/>
    <ellipse cx="280" cy="150" rx="340" ry="130" fill="url(#haze)"/>
    <rect width="880" height="312" fill="url(#scan)"/>

    <!-- terminal chrome -->
    <rect width="880" height="38" fill="#0a0e16"/>
    <line x1="0" y1="38.5" x2="880" y2="38.5" stroke="#1c2940" stroke-width="1"/>
    <circle cx="24" cy="19" r="5.5" fill="#ff5f56"/>
    <circle cx="44" cy="19" r="5.5" fill="#ffbd2e"/>
    <circle cx="64" cy="19" r="5.5" fill="#27c93f"/>
    <text x="440" y="24" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#475569">cHoMpDiSs</text>

    <!-- typed command -->
    <g clip-path="url(#type)">
      <text x="36" y="86" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="17" fill="#50fa7b">❯ <tspan fill="#e2e8f0">whoami</tspan></text>
    </g>
    <rect x="126" y="71" width="10" height="19" fill="#50fa7b" opacity="0">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" begin="1.3s" repeatCount="indefinite"/>
    </rect>

    <!-- name + subtitle -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 12; 0 0" dur="0.7s" begin="1.5s" fill="freeze"/>
      <text x="36" y="158" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="44" font-weight="800" letter-spacing="2" fill="url(#name)" filter="url(#bigglow)" textLength="540" lengthAdjust="spacingAndGlyphs">JORDON MARCHESANO</text>
    </g>
    <text x="36" y="194" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="16" fill="#8b9cb3" opacity="0">AI Engineer @ Get Covered — shipping real-world AI products, fast.
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.9s" fill="freeze"/>
    </text>

    <!-- twinkles -->
    <g fill="#38e1ff">
      <path d="M760,76 l1.4,3.8 3.8,1.4 -3.8,1.4 -1.4,3.8 -1.4,-3.8 -3.8,-1.4 3.8,-1.4 Z">
        <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M824,128 l1.2,3.2 3.2,1.2 -3.2,1.2 -1.2,3.2 -1.2,-3.2 -3.2,-1.2 3.2,-1.2 Z" fill="#fbbf24">
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.4s" repeatCount="indefinite"/>
      </path>
      <path d="M706,178 l1,2.8 2.8,1 -2.8,1 -1,2.8 -1,-2.8 -2.8,-1 2.8,-1 Z">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- dot lane -->
  <circle cx="40" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.1" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.15" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.2" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.25" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.3" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="290" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.35" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.4" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="390" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.45" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="440" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="490" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.55" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="540" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.6" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="590" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.65" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.7" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="690" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.75" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <g>
    <circle cx="740" cy="256" r="8" fill="#fbbf24" filter="url(#glow)">
      <animate attributeName="r" values="7;9;7" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.8" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="790" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.85" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="256" r="4.5" fill="#38e1ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.9" calcMode="discrete" dur="7.0s" repeatCount="indefinite"/>
  </circle>

    <!-- +100 score pop when the power pellet is eaten -->
    <text x="740" y="232" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#fbbf24" opacity="0">+100
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.8;0.8200000000000001;0.92;1" dur="7.0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -14;0 -14" keyTimes="0;0.8;0.92;1" dur="7.0s" repeatCount="indefinite"/>
    </text>

    <!-- chomper -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-60 256; 940 256" dur="7.0s" repeatCount="indefinite"/>
      <circle r="22" fill="#fbbf24" opacity="0.18" filter="url(#bigglow)"/>
      <path fill="#fbbf24" filter="url(#glow)" d="M0 0 L13.1 -9.2 A16 16 0 1 0 13.1 9.2 Z">
        <animate attributeName="d" values="M0 0 L13.1 -9.2 A16 16 0 1 0 13.1 9.2 Z; M0 0 L15.9 -1.4 A16 16 0 1 0 15.9 1.4 Z; M0 0 L13.1 -9.2 A16 16 0 1 0 13.1 9.2 Z" dur="0.32s" repeatCount="indefinite"/>
      </path>
      <circle cx="1" cy="-8.5" r="2.1" fill="#0b1018"/>
    </g>

    <!-- card border on top -->
    <rect x="0.5" y="0.5" width="879" height="311" rx="13.5" stroke="#1c2940" fill="none"/>
  </g>
</svg>
